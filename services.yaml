decorators:
  - name: inventory-loader
    schema:
      $id: inventory-loader
      $schema: https://json-schema.org/draft/202012/schema
      type: object
      required:
        - devices
        - inventory_name
      properties:
        devices:
          type: string
          description: >-
            JSON array of device records to load, e.g.
            [{"name":"sw1","primary_ip":"10.0.0.1","tags":["prod"]}].
            Only "name" is required per record; every other field becomes a
            free-form node attribute.
        inventory_name:
          type: string
          description: "Target Inventory Manager inventory name."
        options:
          type: string
          default: "{}"
          description: >-
            JSON object with every optional toggle, e.g.
            {"create_if_missing": true, "groups": "admins",
            "create_broker_actions": true, "cluster_id": "cluster-itential",
            "yes": true, "include_backup": true, "diff_log_dir": "auto"}.
            Keys: create_if_missing (bool, default false), groups (comma-separated
            string, default ""), create_broker_actions (bool, default false --
            requires cluster_id), cluster_id (string, default ""), dry_run (bool,
            default false -- no platform calls at all), yes (bool, default false --
            confirms the write; without it nothing changes, not even inventory
            creation), preview (bool, default false -- live read-only diff, always
            wins over yes), include_backup (bool, default false -- embeds the
            pre-replace nodes in the result), backup_to (string path, default null,
            local-only), diff_log_dir (string path or "auto", default "" -- opt-in
            timestamped diff audit trail). Omit entirely for all defaults.
      additionalProperties: false

repositories:
  - name: inventory-builder
    url: https://github.com/keepithuman/inventory-builder.git
    reference: main

services:
  - name: inventory-loader
    type: python-script
    description: >-
      Full-replace loads a device list into an Itential Platform Inventory
      Manager inventory. Devices are passed inline as a JSON string (no
      shared filesystem needed between the caller and the script).
    filename: main.py
    working-directory: python-scripts/inventory-loader
    repository: inventory-builder
    decorator: inventory-loader
    tags:
      - inventory
      - itential-platform
    secrets:
      - name: itential-client-id
        type: env
        target: ITENTIAL_CLIENT_ID
      - name: itential-client-secret
        type: env
        target: ITENTIAL_CLIENT_SECRET
    runtime:
      env:
        ITENTIAL_HOST: ps-training-trial-iap01.trial.itential.io
        ITENTIAL_PORT: "443"
