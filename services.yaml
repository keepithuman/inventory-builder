decorators:
  - name: inventory-loader
    schema:
      $id: inventory-loader
      $schema: https://json-schema.org/draft/202012/schema
      type: object
      required:
        - devices
        - inventory_name
      properties:
        devices:
          type: string
          description: >-
            JSON array of device records to load, e.g.
            [{"name":"sw1","primary_ip":"10.0.0.1","tags":["prod"]}].
            Only "name" is required per record; every other field becomes a
            free-form node attribute.
        inventory_name:
          type: string
          description: "Target Inventory Manager inventory name."
        create_if_missing:
          type: string
          default: "false"
          description: "'true' to create the inventory if it doesn't already exist; anything else means false."
        groups:
          type: string
          default: ""
          description: "Comma-separated group name(s) granted access when creating a new inventory (required if creating)."
        dry_run:
          type: string
          default: "false"
          description: "'true' to transform and validate only -- do not call the platform at all."
        yes:
          type: string
          default: "false"
          description: >-
            'true' to confirm the write (including creating the inventory, if
            needed). Otherwise the service returns a read-only diff against the
            actual current nodes plus would_create_inventory, action=
            "confirmation_required", and makes NO changes at all -- re-invoke
            with yes=true once the diff has been reviewed.
        preview:
          type: string
          default: "false"
          description: >-
            'true' to force that same live, read-only diff and exit without
            writing -- always wins over yes=true. Unlike dry_run (which never
            contacts the platform), this authenticates and reads real state.
        include_backup:
          type: string
          default: "false"
          description: "'true' to embed the pre-replace node list in the JSON result, for rollback."
      additionalProperties: false

repositories:
  - name: inventory-builder
    url: https://github.com/keepithuman/inventory-builder.git
    reference: main

services:
  - name: inventory-loader
    type: python-script
    description: >-
      Full-replace loads a device list into an Itential Platform Inventory
      Manager inventory. Devices are passed inline as a JSON string (no
      shared filesystem needed between the caller and the script).
    filename: main.py
    working-directory: python-scripts/inventory-loader
    repository: inventory-builder
    decorator: inventory-loader
    tags:
      - inventory
      - itential-platform
    secrets:
      - name: itential-client-id
        type: env
        target: ITENTIAL_CLIENT_ID
      - name: itential-client-secret
        type: env
        target: ITENTIAL_CLIENT_SECRET
    runtime:
      req-file: requirements.txt
      env:
        ITENTIAL_HOST: ps-training-trial-iap01.trial.itential.io
        ITENTIAL_PORT: "443"
